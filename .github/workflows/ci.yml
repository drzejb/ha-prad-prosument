name: CI
on:
  push:
  pull_request:
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test_logic.txt
      - run: pytest tests/logic -q
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_private.py --builtin-only
      - run: python scripts/check_private.py --builtin-only --history
